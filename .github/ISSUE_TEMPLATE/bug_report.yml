name: Bug Report
description: Report a bug in magic_analytics
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Analytics bugs are easier to fix when we know what
        reached Google, so say whether the event showed up in GA4 DebugView (or
        in `window.dataLayer` on web) and what its parameters were. Never paste
        a Measurement Protocol api_secret or a user's real identifiers.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Register `AnalyticsServiceProvider` in `lib/config/app.dart`
        2. Set `analytics.gtm.container_id` and `analytics.gtm.gateway_path`
        3. Navigate to a route and call `Analytics.track('monitor_created')`
        4. Observe what reaches `window.dataLayer` or DebugView
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Analytics facade (track, screen, identify, opt-out, reset)
        - GTM web driver (dataLayer, consent default, gateway loader)
        - Firebase driver (iOS, Android)
        - Navigator observer (page_view)
        - URL scrubber (token and email masking)
        - Install (plugin:install, lib/config/analytics.dart)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - Not platform-specific
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproduction Code
      description: The smallest snippet that shows the problem.
      render: dart

  - type: input
    id: plugin-version
    attributes:
      label: magic_analytics Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: magic-version
    attributes:
      label: Magic Framework Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: firebase-version
    attributes:
      label: firebase_analytics Version (mobile only)
      placeholder: "13.1.0"

  - type: input
    id: flutter-version
    attributes:
      label: Flutter Version
      placeholder: "3.50.0"
    validations:
      required: true
