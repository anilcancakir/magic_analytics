name: magic_analytics
description: "Analytics for Magic apps: GA4 through GTM on web, Firebase on iOS and Android, one Analytics facade. Ad signals always denied, inert without IDs."
version: 1.0.0
homepage: https://anilcancakir.com/magic/analytics
repository: https://github.com/anilcancakir/magic_analytics
issue_tracker: https://github.com/anilcancakir/magic_analytics/issues

topics:
  - analytics
  - google-analytics
  - firebase
  - magic

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # The floor is 1.0.0, the first stable release, which moved the optional
  # layers out of core into plugins.
  magic: ^1.0.0
  dowel: ^1.0.0
  firebase_core: ^5.2.0
  firebase_analytics: ^13.1.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0
